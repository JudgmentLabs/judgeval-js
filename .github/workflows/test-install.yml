name: Test Install

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.23"

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Build package
        run: bun run build

      - name: Check package contents
        run: bun run check-package

      - name: Check build output
        run: |
          test -f dist/node/index.mjs
          test -f dist/node/index.cjs
          test -f dist/node/index.d.ts
          test -f dist/workers/index.mjs
          test -f dist/workers/index.d.ts
